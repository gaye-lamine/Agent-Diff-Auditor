# Example workflow: demonstrates how Agent Diff Auditor can participate in a real PR review pipeline.
# This is a demonstration workflow and is not required by the application itself.
name: Example Agent Diff Auditor PR check

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze-risk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the pull request diff payload
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --no-color "$BASE_SHA" HEAD > pr.diff
          node <<'NODE'
          const fs = require("node:fs");
          const diff = fs.readFileSync("pr.diff", "utf8");
          fs.writeFileSync("risk-request.json", JSON.stringify({ diff }));
          NODE

      - name: Analyze risk with Agent Diff Auditor
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST "https://agent.lamine-gaye.tech/api/analyze-risk" \
            --header "Content-Type: application/json" \
            --data-binary @risk-request.json \
            --output risk-response.json

      - name: Comment the risk report on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("risk-response.json", "utf8"));
            const risks = report.fileRisks ?? [];

            const lines = risks.length === 0
              ? ["- No file-level risks were returned."]
              : risks.map((risk) => [
                  `- **${risk.filePath}** - ${risk.riskLevel}`,
                  `  - ${risk.justification}`,
                  `  - Evidence: ${risk.citedLines}`
                ].join("\n"));

            const body = [
              "## Agent Diff Auditor - Risk report",
              "",
              ...lines,
              "",
              "_Generated by the example CI integration workflow._"
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
